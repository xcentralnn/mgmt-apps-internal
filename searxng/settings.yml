use_default_settings: true
server:
  limiter: false
  image_proxy: false
search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json
engines:
  - name: duckduckgo
    engine: duckduckgo
    enable_http: true
  - name: google
    engine: google
    enable_http: true
  - name: brave
    engine: brave
    enable_http: true
  - name: bing
    engine: bing
    enable_http: true
  - name: wikipedia
    engine: wikipedia
    enable_http: true
  - name: github
    engine: github
    enable_http: true
  - name: qwant
    engine: qwant
    enable_http: true
  - name: ahmia
    inactive: true
  - name: torch
    inactive: true
