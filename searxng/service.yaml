apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: searxng
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: '2'
        autoscaling.knative.dev/minScale: '0'
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: gcr.io/${PROJECT_ID}/searxng:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          env:
            - name: SEARXNG_LIMITER
              value: "false"
            - name: SEARXNG_SECRET
              value: "${SEARXNG_SECRET}"
