apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: listmonk
  annotations:
    run.googleapis.com/launch-stage: BETA
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/sessionAffinity: 'true'
        autoscaling.knative.dev/maxScale: '1'
        autoscaling.knative.dev/minScale: '0'
    spec:
      containerConcurrency: 80
      timeoutSeconds: 3600
      containers:
        - image: gcr.io/${PROJECT_ID}/listmonk:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: 1000m
              memory: 512Mi
            requests:
              cpu: 250m
              memory: 256Mi
          env:
            - name: LISTMONK_BUCKET_NAME
              value: "${BUCKET_NAME}"
            - name: LISTMONK_ADMIN_USER
              value: "${LISTMONK_ADMIN_USER}"
            - name: LISTMONK_ADMIN_PASSWORD
              value: "${LISTMONK_ADMIN_PASSWORD}"
            - name: LISTMONK_app__address
              value: "0.0.0.0:8080"
            - name: LISTMONK_db__host
              value: "localhost"
            - name: LISTMONK_db__port
              value: "5432"
            - name: LISTMONK_db__user
              value: "listmonk"
            - name: LISTMONK_db__password
              value: "listmonk"
            - name: LISTMONK_db__database
              value: "listmonk"
            - name: LISTMONK_db__ssl_mode
              value: "disable"
